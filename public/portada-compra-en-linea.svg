<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Satisfacción y experiencia de compra en línea">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#fondo)"/>
  <circle cx="1400" cy="120" r="320" fill="#ffffff" fill-opacity="0.07"/>
  <circle cx="180" cy="810" r="380" fill="#ffffff" fill-opacity="0.07"/>

  <!-- Bolsa de compra -->
  <g>
    <path d="M235 350 h310 l36 400 H199 Z" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M300 350 v-44 a90 90 0 0 1 180 0 v44" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" fill-opacity="0"/>
    <rect x="300" y="510" width="180" height="30" rx="15" fill="#6d28d9"/>
    <rect x="300" y="566" width="120" height="24" rx="12" fill="#6d28d9" fill-opacity="0.4"/>
  </g>

  <!-- Tarjeta de reseña con estrellas -->
  <g>
    <rect x="700" y="220" width="660" height="330" rx="44" fill="#ffffff" fill-opacity="0.95"/>
    <g fill="#f59e0b">
      <path d="M0 -26 L7.6 -8.2 L26 -8.2 L11.2 3.8 L16.8 22 L0 11 L-16.8 22 L-11.2 3.8 L-26 -8.2 L-7.6 -8.2 Z" transform="translate(800,330)"/>
      <path d="M0 -26 L7.6 -8.2 L26 -8.2 L11.2 3.8 L16.8 22 L0 11 L-16.8 22 L-11.2 3.8 L-26 -8.2 L-7.6 -8.2 Z" transform="translate(900,330)"/>
      <path d="M0 -26 L7.6 -8.2 L26 -8.2 L11.2 3.8 L16.8 22 L0 11 L-16.8 22 L-11.2 3.8 L-26 -8.2 L-7.6 -8.2 Z" transform="translate(1000,330)"/>
      <path d="M0 -26 L7.6 -8.2 L26 -8.2 L11.2 3.8 L16.8 22 L0 11 L-16.8 22 L-11.2 3.8 L-26 -8.2 L-7.6 -8.2 Z" transform="translate(1100,330)"/>
      <path d="M0 -26 L7.6 -8.2 L26 -8.2 L11.2 3.8 L16.8 22 L0 11 L-16.8 22 L-11.2 3.8 L-26 -8.2 L-7.6 -8.2 Z" transform="translate(1200,330)"/>
    </g>
    <rect x="760" y="410" width="520" height="28" rx="14" fill="#6d28d9" fill-opacity="0.5"/>
    <rect x="760" y="466" width="380" height="24" rx="12" fill="#6d28d9" fill-opacity="0.3"/>
  </g>

  <!-- Barras de resultados -->
  <g fill="#ffffff" fill-opacity="0.22">
    <rect x="1020" y="640" width="70" height="150" rx="14"/>
    <rect x="1110" y="580" width="70" height="210" rx="14"/>
    <rect x="1200" y="520" width="70" height="270" rx="14"/>
    <rect x="1290" y="610" width="70" height="180" rx="14"/>
  </g>
</svg>
